# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- build
- test
- secret-detection
- release

backend:
  stage: build
  image: eclipse-temurin:21-jdk
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  # The course runner cannot start containers (no privileged mode, no Docker socket), so Testcontainers
  # cannot run here. GitLab starts the services instead and the tests connect to them via LMS_TEST_* variables.
  # Locally the tests still use Testcontainers.
  services:
    - name: postgres:17-alpine
      alias: postgres
      variables:
        POSTGRES_DB: lmsdb
        POSTGRES_USER: lmsuser
        POSTGRES_PASSWORD: test-password
    - name: chrislusf/seaweedfs:4.48
      alias: object-storage
      command: ["mini", "-dir=/data", "-volume.max=10", "-master.volumeSizeLimitMB=128", "-master.telemetry=false",
                "-webdav=false", "-admin.ui=false", "-s3.port.iceberg=0", "-s3.port.lance=0"]
      variables:
        AWS_ACCESS_KEY_ID: assignment-test
        AWS_SECRET_ACCESS_KEY: assignment-test-secret
        S3_BUCKET: lms-submissions
    - name: rabbitmq:4.3.6-management
      alias: rabbitmq
      variables:
        RABBITMQ_DEFAULT_USER: messaging-test
        RABBITMQ_DEFAULT_PASS: messaging-test-password
        RABBITMQ_DEFAULT_VHOST: lms
  variables:
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    LMS_TEST_POSTGRES_URL: jdbc:postgresql://postgres:5432/lmsdb
    LMS_TEST_POSTGRES_USER: lmsuser
    LMS_TEST_S3_ENDPOINT: http://object-storage:8333
    LMS_TEST_RABBITMQ_HOST: rabbitmq
  cache:
    key: maven
    paths: [.m2/repository]
  script:
    # Wait until all three services accept connections (up to ~2 minutes).
    - |
      for target in postgres:5432 object-storage:8333 rabbitmq:5672; do
        for attempt in $(seq 1 60); do
          timeout 2 bash -c "</dev/tcp/${target%:*}/${target#*:}" 2>/dev/null && break
          [ "$attempt" = 60 ] && { echo "ERROR: service $target did not start"; exit 1; }
          sleep 2
        done
        echo "$target is up"
      done
    - cd backend
    - chmod +x mvnw
    # Full Maven output goes to an artifact; the job log only shows the summary and the first root cause.
    - |
      if ! ./mvnw -B verify > maven.log 2>&1; then
        grep -m1 -A15 "Caused by" maven.log || true
        grep -E "Tests run:|BUILD|ERROR\]   " maven.log | tail -40
        exit 1
      fi
      grep -E "Tests run:.*Fail|BUILD" maven.log | tail -5
  artifacts:
    when: always
    paths: [backend/maven.log]
    expire_in: 1 week
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

frontend:
  stage: build
  image: node:22
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key: npm
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build

# Builds the backend and frontend images and pushes them to the project's container registry on every
# push to main. Kaniko builds images without a Docker daemon or privileged mode, which this runner lacks.
# Deploy on a host with: docker compose --profile app pull && docker compose --profile app up -d
release-images:
  stage: release
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  parallel:
    matrix:
      - COMPONENT: [backend, frontend]
  script:
    - mkdir -p /kaniko/.docker
    - AUTH=$(printf "%s:%s" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$AUTH\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
        --context "$CI_PROJECT_DIR/$COMPONENT"
        --dockerfile "$CI_PROJECT_DIR/$COMPONENT/Dockerfile"
        --destination "$CI_REGISTRY_IMAGE/$COMPONENT:latest"
        --destination "$CI_REGISTRY_IMAGE/$COMPONENT:$CI_COMMIT_SHORT_SHA"
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
