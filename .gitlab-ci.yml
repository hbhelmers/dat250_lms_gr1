# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- build
- test
- secret-detection

backend:
  stage: build
  image: eclipse-temurin:21-jdk
  services:
    - name: docker:27-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  cache:
    key: maven
    paths: [.m2/repository]
  script:
    # Testcontainers needs the dind service. It is reachable as "docker" on the Docker executor
    # and as "localhost" on the Kubernetes executor; use whichever answers.
    - |
      for attempt in $(seq 1 30); do
        for host in docker localhost; do
          if timeout 2 bash -c "</dev/tcp/$host/2375" 2>/dev/null; then
            export DOCKER_HOST="tcp://$host:2375" TESTCONTAINERS_HOST_OVERRIDE="$host"; break 2
          fi
        done
        sleep 2
      done
      if [ -z "$DOCKER_HOST" ]; then
        echo "ERROR: Docker-in-Docker is not reachable on docker:2375 or localhost:2375."
        echo "The runner probably does not allow privileged mode, which docker:dind needs."
        exit 1
      fi
      echo "Using Docker at $DOCKER_HOST (CI_RUNNER_DESCRIPTION=$CI_RUNNER_DESCRIPTION)"
    - cd backend
    - chmod +x mvnw
    # Full Maven output goes to an artifact; the job log only shows the summary and the first root cause.
    - |
      if ! ./mvnw -B verify > maven.log 2>&1; then
        grep -m1 -A15 "Caused by" maven.log || true
        grep -E "Tests run:|BUILD|ERROR\]   " maven.log | tail -40
        exit 1
      fi
      grep -E "Tests run:.*Fail|BUILD" maven.log | tail -5
  artifacts:
    when: always
    paths: [backend/maven.log]
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml

frontend:
  stage: build
  image: node:22
  cache:
    key: npm
    paths: [frontend/.npm]
  script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection
