spring.application.name=LMS
spring.profiles.default=local
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lmsdb
spring.datasource.username=lmsuser
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.same-site=lax

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
lms.storage.endpoint=${LMS_STORAGE_ENDPOINT:http://127.0.0.1:8333}
lms.storage.bucket=lms-submissions
lms.storage.access-key=${LMS_STORAGE_ACCESS_KEY:}
lms.storage.secret-key=${LMS_STORAGE_SECRET_KEY:}
