spring.application.name=LMS
spring.profiles.default=local
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/lmsdb
spring.datasource.username=lmsuser
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.servlet.session.cookie.same-site=lax

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
lms.storage.endpoint=${LMS_STORAGE_ENDPOINT:http://127.0.0.1:8333}
lms.storage.bucket=lms-submissions
lms.storage.access-key=${LMS_STORAGE_ACCESS_KEY:}
lms.storage.secret-key=${LMS_STORAGE_SECRET_KEY:}

lms.messaging.enabled=${LMS_MESSAGING_ENABLED:false}
spring.rabbitmq.host=${LMS_RABBITMQ_HOST:127.0.0.1}
spring.rabbitmq.port=${LMS_RABBITMQ_PORT:5672}
spring.rabbitmq.virtual-host=${LMS_RABBITMQ_VHOST:lms}
spring.rabbitmq.username=${LMS_RABBITMQ_USERNAME:}
spring.rabbitmq.password=${LMS_RABBITMQ_PASSWORD:}
spring.rabbitmq.connection-timeout=3s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.dynamic=${lms.messaging.enabled}
spring.rabbitmq.listener.simple.auto-startup=${lms.messaging.enabled}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=20
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s
