services:
  postgres:
    image: postgres:17
    container_name: dat250-postgres

    environment:
      POSTGRES_DB: lmsdb
      POSTGRES_USER: lmsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -volume.max=10 -master.volumeSizeLimitMB=128 -master.telemetry=false -webdav=false -admin.ui=false -s3.port.iceberg=0 -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${LMS_STORAGE_ACCESS_KEY:-lms-local-access}
      AWS_SECRET_ACCESS_KEY: ${LMS_STORAGE_SECRET_KEY:-lms-local-secret}
      S3_BUCKET: lms-submissions
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object_data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3.6-management
    hostname: lms-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${LMS_RABBITMQ_USERNAME:-lms-local}
      RABBITMQ_DEFAULT_PASS: ${LMS_RABBITMQ_PASSWORD:-lms-local-password}
      RABBITMQ_DEFAULT_VHOST: lms
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  backend:
    # Pulled from the GitLab registry when D250_REG is set (see .env.example), otherwise built locally.
    image: ${D250_REG:-dat250-lms}/backend:latest
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lmsdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      LMS_STORAGE_ENDPOINT: http://object-storage:8333
      LMS_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_started
      object-storage:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    profiles: [app]

  frontend:
    image: ${D250_REG:-dat250-lms}/frontend:latest
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    profiles: [app]

volumes:
  postgres_data:
  object_data:
  rabbitmq_data:
